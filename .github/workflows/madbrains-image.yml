name: MadBrains image
on:
  push:
    branches: [main]
    tags: ['mb-v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'MadBrains/mcp-atlassian'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --frozen --all-extras --dev
      - run: uv run pytest tests/unit/ -q
      - run: uv run pre-commit run --all-files
  image:
    if: github.repository == 'MadBrains/mcp-atlassian'
    needs: verify
    runs-on: ubuntu-latest
    env:
      KEY_ID: ${{ secrets.CLOUDRU_REGISTRY_KEY_ID }}
      KEY_SECRET: ${{ secrets.CLOUDRU_REGISTRY_KEY_SECRET }}
      REGISTRY: mb-registry.cr.cloud.ru
      IMAGE: mb-registry.cr.cloud.ru/mad-os/confluence-mcp
    steps:
      - name: Check registry credentials
        id: registry
        run: |
          if [[ -z "$KEY_ID" || -z "$KEY_SECRET" ]]; then
            echo "::notice::Registry credentials are absent; skipping image publication."
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
      - if: steps.registry.outputs.available == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - if: steps.registry.outputs.available == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Login to Cloud.ru Artifact Registry
        if: steps.registry.outputs.available == 'true'
        run: |
          printf '%s' "$KEY_SECRET" | docker login "$REGISTRY" -u "$KEY_ID" --password-stdin
      - name: Version
        if: steps.registry.outputs.available == 'true'
        id: version
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          version="0.24.6-mb.${GITHUB_RUN_NUMBER}"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${RELEASE_REF#mb-v}"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-mb\.[0-9]+$ ]] || exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "package=${version/-mb./+mb.}" >> "$GITHUB_OUTPUT"
      - if: steps.registry.outputs.available == 'true'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          context: .
          push: true
          build-args: VERSION=${{ steps.version.outputs.package }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.value }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
